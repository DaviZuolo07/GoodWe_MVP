# Mesmos cabeçalhos do vercel.json, para o teste local ser fiel ao publicado.
server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=()" always;

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Rotas do React: tudo que não é arquivo cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
